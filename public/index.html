<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChEMBL Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }

    header {
      background: #1a365d;
      color: white;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header span { font-size: 0.85rem; opacity: 0.7; }

    .ticker-bar {
      background: #112a4a;
      border-top: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
    }
    .ticker-track {
      display: inline-block;
      animation: ticker 250s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    .ticker-item {
      display: inline-block;
      padding: 0 80px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.75);
    }
    .ticker-item em { color: #90cdf4; font-style: normal; font-weight: 600; }
    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: white;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }

    label { font-size: 0.85rem; font-weight: 600; color: #4a5568; display: block; margin-bottom: 6px; }

    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: #3182ce; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary { background: #3182ce; color: white; }
    .btn-primary:hover { background: #2b6cb0; }
    .btn-success { background: #38a169; color: white; }
    .btn-success:hover { background: #276749; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #search-results { margin-top: 12px; }
    .target-item {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .target-item:hover { background: #ebf8ff; border-color: #3182ce; }
    .target-item.selected { background: #ebf8ff; border-color: #3182ce; }
    .target-name { font-weight: 600; font-size: 0.9rem; }
    .target-meta { font-size: 0.78rem; color: #718096; margin-top: 2px; }

    .selected-tag {
      display: inline-block;
      background: #ebf8ff;
      border: 1px solid #3182ce;
      color: #2b6cb0;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 8px;
    }

    #status { font-size: 0.85rem; color: #718096; margin-top: 8px; min-height: 18px; }
    .error { color: #e53e3e; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #edf2f7; padding: 8px 10px; text-align: left; font-weight: 600; color: #4a5568; border-bottom: 2px solid #cbd5e0; }
    td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; }
    tr:hover td { background: #f7fafc; }

    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .total-badge { font-size: 0.82rem; color: #718096; }

    footer {
      text-align: center;
      padding: 28px 16px;
      font-size: 0.82rem;
      color: #718096;
    }
    footer strong { color: #2d3748; }
    footer a {
      color: #3182ce;
      text-decoration: none;
      margin: 0 8px;
      font-weight: 500;
    }
    footer a:hover { text-decoration: underline; }
    .footer-links { margin-top: 8px; display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>ChEMBL Explorer</h1>
    <span>Search and download bioactivity data</span>
  </div>
</header>

<div class="ticker-bar">
  <div class="ticker-track" id="ticker"></div>
</div>

<div class="container">

  <div class="card">
    <label>Search Target</label>
    <div class="row" style="margin-bottom: 10px;">
      <input id="query" type="text" placeholder="e.g. MAP4K1, EGFR, BRAF..." />
      <select id="activity-type" style="max-width:160px;">
        <option value="IC50">IC50</option>
        <option value="Ki">Ki</option>
        <option value="Kd">Kd</option>
        <option value="EC50">EC50</option>
        <option value="Potency">Potency</option>
      </select>
      <button class="btn btn-primary" style="max-width:130px;" onclick="searchTarget()">Search</button>
    </div>
    <div id="search-results"></div>
    <div id="selected-label"></div>
  </div>

  <div class="card" id="action-card" style="display:none;">
    <div class="actions">
      <button class="btn btn-primary" onclick="previewData()">Preview (100 rows)</button>
      <button class="btn btn-success" id="btn-download" onclick="downloadCSV()">Download full CSV</button>
      <span class="total-badge" id="total-label"></span>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="table-card" style="display:none;">
    <div style="overflow-x:auto;">
      <table id="data-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<footer>
  <strong>Developed by Carlos Seiti H. Shiraishi</strong>
  <div class="footer-links">
    <a href="https://github.com/cShiraishi" target="_blank">GitHub</a>
    &bull;
    <a href="https://www.linkedin.com/in/carlosseiti" target="_blank">LinkedIn</a>
    &bull;
    <a href="https://www.youtube.com/@carlosseitv" target="_blank">YouTube — Carlos Seiti TV</a>
  </div>
</footer>

<script>
  let selectedTarget = null;

  async function searchTarget() {
    const q = document.getElementById('query').value.trim();
    if (!q) return;
    const div = document.getElementById('search-results');
    div.innerHTML = '<span style="color:#718096;font-size:0.85rem;">Searching...</span>';
    document.getElementById('selected-label').innerHTML = '';
    document.getElementById('action-card').style.display = 'none';
    document.getElementById('table-card').style.display = 'none';
    selectedTarget = null;

    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!data.length) { div.innerHTML = '<span style="color:#e53e3e;font-size:0.85rem;">No targets found.</span>'; return; }
      div.innerHTML = data.map(t => `
        <div class="target-item" onclick="selectTarget('${t.id}', '${escHtml(t.name)}')">
          <div class="target-name">${escHtml(t.name || t.id)}</div>
          <div class="target-meta">${t.id} &bull; ${t.type || ''} &bull; ${t.organism || ''}</div>
        </div>
      `).join('');
    } catch(e) {
      div.innerHTML = '<span class="error">Search failed. Please try again.</span>';
    }
  }

  function selectTarget(id, name) {
    selectedTarget = id;
    document.querySelectorAll('.target-item').forEach(el => el.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    document.getElementById('selected-label').innerHTML = `<span class="selected-tag">Selected: ${escHtml(name)} (${id})</span>`;
    document.getElementById('action-card').style.display = 'block';
    document.getElementById('table-card').style.display = 'none';
    document.getElementById('status').textContent = '';
    document.getElementById('total-label').textContent = '';
  }

  async function previewData() {
    if (!selectedTarget) return;
    const type = document.getElementById('activity-type').value;
    setStatus('Loading preview...');
    try {
      const res = await fetch(`/api/preview?target_id=${selectedTarget}&activity_type=${type}&limit=100`);
      const json = await res.json();
      const data = json.data;
      if (!data.length) { setStatus('No data found for this filter.', true); return; }
      renderTable(data);
      document.getElementById('total-label').textContent = `Showing ${data.length} records`;
      setStatus('');
    } catch(e) {
      setStatus('Failed to load data.', true);
    }
  }

  function downloadCSV() {
    if (!selectedTarget) return;
    const type = document.getElementById('activity-type').value;
    const url = `/api/download?target_id=${selectedTarget}&activity_type=${type}`;
    setStatus('Starting download...');
    const a = document.createElement('a');
    a.href = url;
    a.download = `${selectedTarget}_${type}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => setStatus(''), 2000);
  }

  function renderTable(data) {
    const keys = Object.keys(data[0]);
    const thead = document.querySelector('#data-table thead');
    const tbody = document.querySelector('#data-table tbody');
    thead.innerHTML = '<tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr>';
    tbody.innerHTML = data.map(row =>
      '<tr>' + keys.map(k => `<td>${row[k] ?? ''}</td>`).join('') + '</tr>'
    ).join('');
    document.getElementById('table-card').style.display = 'block';
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  document.getElementById('query').addEventListener('keydown', e => { if (e.key === 'Enter') searchTarget(); });

  const quotes = [
    { text: "Nothing in life is to be feared, it is only to be understood.", author: "Marie Curie", prize: "Nobel Prize in Physics (1903) & Chemistry (1911)" },
    { text: "Imagination is more important than knowledge.", author: "Albert Einstein", prize: "Nobel Prize in Physics (1921)" },
    { text: "The first principle is that you must not fool yourself — and you are the easiest person to fool.", author: "Richard Feynman", prize: "Nobel Prize in Physics (1965)" },
    { text: "Discovery consists of seeing what everybody has seen and thinking what nobody has thought.", author: "Albert Szent-Györgyi", prize: "Nobel Prize in Medicine (1937)" },
    { text: "The best way to have a good idea is to have lots of ideas.", author: "Linus Pauling", prize: "Nobel Prize in Chemistry (1954) & Peace (1962)" },
    { text: "If you want to understand function, study structure.", author: "Francis Crick", prize: "Nobel Prize in Medicine (1962)" },
    { text: "The important thing is not to stop questioning. Curiosity has its own reason for existing.", author: "Albert Einstein", prize: "Nobel Prize in Physics (1921)" },
    { text: "We are all connected; to each other biologically, to the earth chemically, to the rest of the universe atomically.", author: "Dorothy Crowfoot Hodgkin", prize: "Nobel Prize in Chemistry (1964)" },
    { text: "Science is a way of thinking much more than it is a body of knowledge.", author: "Peter Medawar", prize: "Nobel Prize in Medicine (1960)" },
    { text: "In every walk with nature, one receives far more than he seeks.", author: "Max Perutz", prize: "Nobel Prize in Chemistry (1962)" },
  ];

  const items = [...quotes, ...quotes].map(q =>
    `<span class="ticker-item">"${q.text}" — <em>${q.author}, ${q.prize}</em></span>`
  ).join('');
  document.getElementById('ticker').innerHTML = items;
</script>

</body>
</html>
